
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Generate Fresh Android Project
        run: npx cap add android

      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          android = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", android)

          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise Exception("Android application tag missing")

          meta = app.find("meta-data[@android:name='com.google.android.gms.ads.APPLICATION_ID']", {"android": android})

          if meta is None:
              meta = ET.SubElement(app, "meta-data")

          meta.set(f"{{{android}}}name", "com.google.android.gms.ads.APPLICATION_ID")
          meta.set(f"{{{android}}}value", "ca-app-pub-6585633621662004~5485948664")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Sync Capacitor Plugins
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
